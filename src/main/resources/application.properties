spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ssl_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.error.include-message=always

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=SSLHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=100000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=5000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:dev-only-2f8a1c93b7e64d15a0c4f8e21b6d9375-secret-do-not-use-in-prod}
jwt.expiration=${JWT_EXPIRATION_SECONDS:14400}
file.upload-dir=${UPLOAD_DIR:./uploads}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=60MB

server.port=9090
server.address=0.0.0.0
